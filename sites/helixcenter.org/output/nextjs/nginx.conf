# /etc/nginx/sites-available/helixcenter
# Nginx reverse proxy configuration for The Helix Center

upstream helixcenter_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name helixcenter.org www.helixcenter.org;
    return 301 https://helixcenter.org$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.helixcenter.org;

    ssl_certificate /etc/letsencrypt/live/helixcenter.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helixcenter.org/privkey.pem;

    return 301 https://helixcenter.org$request_uri;
}

# Main server block
server {
    listen 443 ssl http2;
    server_name helixcenter.org;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/helixcenter.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helixcenter.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://media.helixcenter.org https://www.helixcenter.org https://secure.gravatar.com data:; media-src 'self' https://media.helixcenter.org; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static files - serve directly from Next.js build output
    location /_next/static {
        proxy_pass http://helixcenter_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Public static files
    location /public {
        proxy_pass http://helixcenter_app;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Favicon and robots
    location = /favicon.ico {
        proxy_pass http://helixcenter_app;
        expires 30d;
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://helixcenter_app;
        expires 1d;
        log_not_found off;
    }

    # Main application
    location / {
        proxy_pass http://helixcenter_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Access and error logs
    access_log /var/log/nginx/helixcenter.access.log;
    error_log /var/log/nginx/helixcenter.error.log;
}
