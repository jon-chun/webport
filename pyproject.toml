[build-system]
requires = ["hatchling>=1.18.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "webport"
dynamic = ["version"]
description = "Reverse-engineer any website. Port it anywhere."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "WebPort Contributors" }
]
maintainers = [
    { name = "WebPort Team" }
]
keywords = [
    "wordpress",
    "migration",
    "static-site",
    "web-scraping",
    "nextjs",
    "reverse-engineering",
    "code-generation",
    "website-porting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

dependencies = [
    # HTTP & Networking
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "urllib3>=2.1.0",

    # Web Scraping
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=1.8.0",
    "playwright>=1.40.0",
    "scrapy>=2.11.0",

    # Data Validation & Models
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database & Storage
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",

    # CLI & UI
    "typer[all]>=0.9.0",
    "rich>=13.7.0",

    # Async & Concurrency
    "tenacity>=8.2.0",
    "aiofiles>=23.2.0",

    # Serialization
    "orjson>=3.9.0",
    "pyyaml>=6.0.0",
    "toml>=0.10.0",

    # Analysis
    "networkx>=3.2.0",
    "pandas>=2.1.0",

    # Templating & Code Generation
    "jinja2>=3.1.0",

    # Security
    "cryptography>=41.0.0",
    "keyring>=24.3.0",

    # Notifications
    "aiosmtplib>=3.0.0",
    "slack-sdk>=3.23.0",

    # Metrics & Monitoring
    "prometheus-client>=0.19.0",

    # Visualization (optional heavy deps)
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "hypothesis>=6.92.0",
    "respx>=0.20.0",
    "pytest-httpx>=0.28.0",
    "mypy>=1.8.0",
    "ruff>=0.1.9",
    "black>=23.12.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
]

all = [
    "webport[dev,docs]",
]

[project.scripts]
webport = "webport.cli.main:app"

[project.urls]
Homepage = "https://github.com/jon-chun/webport"
Repository = "https://github.com/jon-chun/webport.git"
Issues = "https://github.com/jon-chun/webport/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/webport/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webport"]

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["webport"]

# =============================================================================
# Black Configuration
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

# =============================================================================
# MyPy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "scrapy.*",
    "playwright.*",
    "trafilatura.*",
    "networkx.*",
    "plotly.*",
    "pandas.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-p", "no:warnings",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "contract: marks tests as contract tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["src/webport"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# Bandit Security Configuration
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101"]  # assert_used
